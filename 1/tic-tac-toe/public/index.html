<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe | Node.js & Express</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>TIC TAC TOE</h1>
      <p class="subtitle">Powered by Node.js & Express</p>
    </header>

    <div class="mode-selector">
      <button id="mode-pvp" class="mode-btn active" data-mode="pvp">
        <span>👥</span> 2 Players
      </button>
      <button id="mode-pve" class="mode-btn" data-mode="pve">
        <span>🤖</span> vs Computer
      </button>
    </div>

    <div class="scoreboard">
      <div class="score-card player-x">
        <span class="label">PLAYER X</span>
        <span id="score-x" class="value">0</span>
      </div>
      <div class="score-card ties">
        <span class="label">DRAWS</span>
        <span id="score-ties" class="value">0</span>
      </div>
      <div class="score-card player-o">
        <span id="label-o" class="label">PLAYER O</span>
        <span id="score-o" class="value">0</span>
      </div>
    </div>

    <div id="status-banner" class="status-banner turn-x">
      <span id="status-text">Player X's turn</span>
    </div>

    <main class="board-container">
      <div class="board" id="board">
        <button class="cell" data-index="0" aria-label="Cell 1"></button>
        <button class="cell" data-index="1" aria-label="Cell 2"></button>
        <button class="cell" data-index="2" aria-label="Cell 3"></button>
        <button class="cell" data-index="3" aria-label="Cell 4"></button>
        <button class="cell" data-index="4" aria-label="Cell 5"></button>
        <button class="cell" data-index="5" aria-label="Cell 6"></button>
        <button class="cell" data-index="6" aria-label="Cell 7"></button>
        <button class="cell" data-index="7" aria-label="Cell 8"></button>
        <button class="cell" data-index="8" aria-label="Cell 9"></button>
      </div>
    </main>

    <footer class="controls">
      <button id="restart-btn" class="btn btn-primary">
        🔄 Restart Game
      </button>
      <button id="reset-scores-btn" class="btn btn-secondary">
        🗑️ Reset Scores
      </button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
